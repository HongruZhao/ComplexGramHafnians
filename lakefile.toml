name = "complexGramHafnians"
version = "1.0.0"
description = "Shifted anticoncentration for complex Gram and symmetric Gaussian hafnians"
license = "GPL-3.0-only"
licenseFiles = ["LICENSE"]
keywords = ["Lean", "probability", "Gaussian-boson-sampling"]
defaultTargets = ["ComplexGramHafnians", "Verification"]
fixedToolchain = true

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "641fbd329d4ffb62bef83c51f54088469056bd36"

[[lean_lib]]
name = "LogdetLean"

[[lean_lib]]
name = "Challenge"
leanOptions = { warningAsError = true }

[[lean_lib]]
name = "ComplexGramHafnians"
leanOptions = { warningAsError = true }

[[lean_lib]]
name = "Verification"
leanOptions = { warningAsError = true }
